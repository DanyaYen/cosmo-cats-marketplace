name: Build & Test Cosmo Cats Marketplace

on:
  pull_request:
    branches: [ main, feat/lab-1, feat/lab-2, feat/lab-3, feat/lab-4 ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Tests & JaCoCo Report
        run: ./gradlew test jacocoTestReport
