services:
  postgres:
    image: postgres:16-alpine
    container_name: cosmocats-postgres
    environment:
      POSTGRES_DB: cosmocats
      POSTGRES_USER: cosmocats
      POSTGRES_PASSWORD: cosmocats
    ports:
      - "5432:5432"
    volumes:
      - cosmocats_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmocats -d cosmocats"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cosmocats_pgdata:
